<meta name="mobile-web-app-capable" content="yes">

<link rel="manifest" href="/manifest.webmanifest">

<title>Private Chat</title>

</head>

<symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3.5"/><circle cx="9" cy="10" r="1.7"/><path d="M21 16l-5-5-8 9"/></symbol>

<symbol id="i-gauge" viewBox="0 0 24 24"><path d="M4 17a8 8 0 1 1 16 0"/><path d="M12 17l4-5"/></symbol>

<!-- ============ AUTH ============ -->
<section class="auth" id="auth" hidden>
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <form class="card glass" id="authForm" autocomplete="on">
    <div class="orb"></div>
    <h1 id="authTitle"></h1>
    <label class="field"><svg class="i"><use href="#i-user"/></svg><input id="aUser" name="username" autocomplete="username" placeholder="ユーザー名" spellcheck="false" autocapitalize="none"></label>
    <label class="field"><svg class="i"><use href="#i-key"/></svg><input id="aPass" name="password" type="password" autocomplete="current-password" placeholder="パスワード"></label>
    <label class="field" id="aPass2Box" hidden><svg class="i"><use href="#i-check"/></svg><input id="aPass2" type="password" autocomplete="new-password" placeholder="パスワード(確認)"></label>
    <div class="auth-err" id="authErr"></div>
    <button class="go" id="authGo" type="submit" aria-label="続ける"><svg class="i lg"><use href="#i-up"/></svg></button>
    <button class="pk" id="pkLogin" type="button" hidden><svg class="i"><use href="#i-finger"/></svg><span>パスキー</span></button>
  </form>
</section>

<!-- ============ APP ============ -->
<div class="shell sb-open" id="shell" hidden>
  <div class="scrim" id="scrim"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sb-top">
      <button class="ib" id="btnSideIn" aria-label="サイドバー"><svg class="i"><use href="#i-sidebar"/></svg></button>
      <button class="ib" id="btnNew" aria-label="新しいチャット"><svg class="i"><use href="#i-plus"/></svg></button>
    </div>
    <label class="sb-search"><svg class="i sm"><use href="#i-search"/></svg><input id="chatQ" type="search" placeholder="検索" autocomplete="off" spellcheck="false" aria-label="チャットを検索"></label>
    <div class="sb-list" id="chatList"></div>
    <div class="sb-foot">
      <button class="av" id="sbAv"></button>
      <div class="who"><b id="sbName"></b><span id="sbRole"></span></div>
      <button class="ib" id="btnSettings" aria-label="設定"><svg class="i"><use href="#i-sliders"/></svg></button>
    </div>
  </aside>

  <main class="chat" id="chat">
    <header class="top glass" id="top">
      <button class="ib" id="btnSide" aria-label="サイドバー"><svg class="i"><use href="#i-sidebar"/></svg></button>
      <button class="chip" id="btnModel" aria-expanded="false"></button>
      <div class="grow"></div>
      <button class="pill" id="btnBudget" aria-label="予算"></button>
      <button class="ib" id="btnPv" aria-label="プレビュー"><svg class="i"><use href="#i-eye"/></svg></button>
    </header>
    <div class="scroll" id="scroll"><div class="thread" id="thread"></div></div>
    <div class="dock">
      <div class="composer glass" id="composer">
        <div class="cmeter" id="cmeter"><div class="bar"><i class="w"></i><i class="e"></i><i class="u"></i></div><div class="nums" id="nums"></div></div>
        <div class="ebar" id="ebar" hidden></div>
        <div class="atts" id="atts"></div>
        <textarea id="input" rows="1" placeholder="メッセージ" aria-label="メッセージ"></textarea>
        <div class="crow">
          <button class="ib" id="btnAttach" aria-label="添付"><svg class="i"><use href="#i-clip"/></svg></button>
          <button class="tog" id="btnMem" aria-label="メモリ" aria-pressed="true"><svg class="i"><use href="#i-memory"/></svg><sup>0</sup></button>
          <button class="tog" id="btnSearch" aria-label="Web検索" aria-pressed="false"><svg class="i"><use href="#i-globe"/></svg><sup>3</sup></button>
          <div class="grow"></div>
          <button class="lim" id="limBox" hidden></button>
          <button class="send" id="btnSend" data-mode="idle" aria-label="送信">
            <span class="sico a"><svg class="i"><use href="#i-up"/></svg></span>
            <span class="sico s"><svg class="i"><use href="#i-stop"/></svg></span>
            <span class="sico l"><svg class="i"><use href="#i-lock"/></svg></span>
          </button>
        </div>
        <input type="file" id="file" multiple hidden accept="image/png,image/jpeg,image/gif,image/webp,application/pdf,.txt,.md,.csv,.json,.html,.css,.js,.ts,.py,.xml,.yaml,.yml,.log">
      </div>
    </div>
  </main>

  <section class="preview" id="preview" aria-label="プレビュー">
    <div class="pv-in">
      <div class="pv-bar glass">
        <div class="seg" id="pvMode"><span class="hl"></span><button data-m="preview" class="on" aria-label="プレビュー"><svg class="i sm"><use href="#i-eye"/></svg></button><button data-m="code" aria-label="コード"><svg class="i sm"><use href="#i-code"/></svg></button></div>
        <div class="seg" id="pvDev"><span class="hl"></span><button data-d="desktop" class="on" aria-label="デスクトップ"><svg class="i sm"><use href="#i-monitor"/></svg></button><button data-d="phone" aria-label="スマートフォン"><svg class="i sm"><use href="#i-phone"/></svg></button></div>
        <span class="live" id="pvLive"></span>
        <div class="ver" id="pvVer" hidden><button id="pvPrev" aria-label="前の版">‹</button><b id="pvVn"></b><button id="pvNext" aria-label="次の版">›</button></div>
        <div class="grow"></div>
        <button class="ib" id="pvRefresh" aria-label="再読み込み"><svg class="i"><use href="#i-refresh"/></svg></button>
        <button class="ib" id="pvCopy" aria-label="コピー"><svg class="i"><use href="#i-copy"/></svg></button>
        <button class="ib" id="pvDl" aria-label="HTMLを保存"><svg class="i"><use href="#i-download"/></svg></button>
        <button class="ib" id="pvClose" aria-label="閉じる"><svg class="i"><use href="#i-x"/></svg></button>
      </div>
      <div class="pv-stage" id="pvStage"><div class="frame" id="pvFrame"></div><pre class="pv-code" id="pvCode"></pre></div>
      <div class="pv-err" id="pvErr" hidden></div>
    </div>
  </section>
</div>
<div class="drop" id="drop"><div><svg class="i lg" style="width:44px;height:44px"><use href="#i-plus"/></svg></div></div>
<div id="layer"></div>

<script src="/app.js"></script>
</body>
</html>
