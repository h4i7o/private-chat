<div class="shell sb-open" id="shell" hidden>
  <div class="scrim" id="scrim"></div>
  <aside class="sidebar" id="sidebar">

      <button class="ib" id="btnSideIn" aria-label="Sidebar"><svg class="i"><use href="#i-sidebar"/></svg></button>
      <button class="ib" id="btnNew" aria-label="New chat"><svg class="i"><use href="#i-plus"/></svg></button>
    </div>

    <div class="sb-foot">
      <button class="av" id="sbAv"></button>
      <div class="who"><b id="sbName"></b><span id="sbRole"></span></div>
      
    </div>

  <main class="chat" id="chat">

      <button class="pill" id="btnBudget" aria-label="Budget"></button>

        <div class="tab" aria-hidden="true"><s></s><s></s><s></s></div>

            <span class="sico l"><svg class="i"><use href="#i-lock"/></svg></span>

        <div class="seg" id="pvDev"><span class="hl"></span><button data-d="desktop" class="on" aria-label="Desktop"><svg class="i sm"><use href="#i-monitor"/></svg></button><button data-d="phone" aria-label="Phone"><svg class="i sm"><use href="#i-phone"/></svg></button></div>

        <div class="ver" id="pvVer" hidden><button id="pvPrev" aria-label="Previous version">‹</button><b id="pvVn"></b><button id="pvNext" aria-label="Next version">›</button></div>
        <div class="grow"></div>
        <button class="ib" id="pvRefresh" aria-label="Reload"><svg class="i"><use href="#i-refresh"/></svg></button>
        <button class="ib" id="pvCopy" aria-label="Copy"><svg class="i"><use href="#i-copy"/></svg></button>
        <button class="ib" id="pvDl" aria-label="Save HTML"><svg class="i"><use href="#i-download"/></svg></button>
        <button class="ib" id="pvClose" aria-label="Close"><svg class="i"><use href="#i-x"/></svg></button>
      </div>
      <div class="pv-stage" id="pvStage"><div class="frame" id="pvFrame"></div><pre class="pv-code" id="pvCode"></pre><div class="pv-doc ai-body" id="pvDoc"></div></div>
      <div class="pv-err" id="pvErr" hidden></div>
    </div>
  </section>
</div>
